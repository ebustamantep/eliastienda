<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autopartes Elias · Repuestos automotrices</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#18181b;--mute:#71717a;--line:#e4e4e7;--acc:#e8590c;--wa:#25d366;--ok:#16a34a;--warn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1a1a1d;--ink:#f4f4f5;--mute:#a1a1aa;--line:#2e2e33}}
:root[data-theme="dark"]{--bg:#111113;--card:#1a1a1d;--ink:#f4f4f5;--mute:#a1a1aa;--line:#2e2e33}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-weight:700;letter-spacing:-.02em;font-size:18px;white-space:nowrap}
.logo b{color:var(--acc)}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.search:focus{outline:2px solid var(--acc);outline-offset:-1px}
.cartbtn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.cartbtn span{background:var(--acc);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
.hero{padding:36px 0 18px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px);letter-spacing:-.03em;line-height:1.1}
.hero p{margin:0;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.thumb{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,var(--line),transparent);display:grid;place-items:center;font-size:52px}
.cat{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0;font-size:15px;line-height:1.3}
.sku,.fit{font-size:12px;color:var(--mute)}
.stock{font-size:12px}.in{color:var(--ok)}.low{color:var(--warn)}.out{color:#dc2626}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:18px}
.add{border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 14px;cursor:pointer}
.add:disabled{opacity:.35;cursor:not-allowed}
.add:hover:not(:disabled){background:var(--acc);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.shade{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.shade.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.on{transform:none}
aside header{position:static;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card)}
aside h2{margin:0;font-size:17px}
.x{border:0;background:none;font-size:22px;cursor:pointer;line-height:1}
.items{flex:1;overflow:auto;padding:0 16px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:none;border-radius:7px;cursor:pointer}
.foot{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.foot input,.foot textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.wa{border:0;background:var(--wa);color:#06260f;font-weight:700;border-radius:10px;padding:12px;cursor:pointer}
.wa:disabled{opacity:.4;cursor:not-allowed}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--mute);font-size:13px;text-align:center}
</style>
</head>
<body>

<header><div class="wrap bar">
  <div class="logo">Autopartes <b>Elias</b></div>
  <input class="search" id="q" type="search" placeholder="Buscar repuesto, marca, SKU…" aria-label="Buscar">
  <button class="cartbtn" id="openCart">Carrito<span id="count">0</span></button>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Repuestos que sí encajan.</h1>
    <p>Elige tus productos y envía el pedido directo por WhatsApp.</p>
  </section>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Demo · precios referenciales en USD · Pedido confirmado por WhatsApp</footer>

<div class="shade" id="shade"></div>
<aside id="drawer" aria-label="Carrito">
  <header><h2>Tu pedido</h2><button class="x" id="closeCart" aria-label="Cerrar">×</button></header>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <input id="cname" placeholder="Tu nombre">
    <textarea id="cnote" rows="2" placeholder="Vehículo (marca, modelo, año) y notas"></textarea>
    <button class="wa" id="send" disabled>Enviar pedido por WhatsApp</button>
  </div>
</aside>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  store: "Autopartes Elias",
  whatsapp: "584120000000",   // número con código de país, sin + ni espacios
  currency: "$",
  // Para WooCommerce: pon aquí tu sitio y activa loadProducts() remoto
  wcSite: "",                 // ej. "https://mitienda.com"
};

/* ============ DATOS DEMO ============
   Estructura espejo de la REST API de WooCommerce (/wp-json/wc/v3/products):
   id, name, sku, price, categories[{name}], stock_status, stock_quantity, short_description */
const DEMO = [
 {id:1, name:"Pastillas de freno delanteras", sku:"FR-1001", price:"28.50", categories:[{name:"Frenos"}], stock_status:"instock", stock_quantity:14, short_description:"Toyota Corolla 2010–2018", icon:"🛑"},
 {id:2, name:"Disco de freno ventilado", sku:"FR-1002", price:"41.00", categories:[{name:"Frenos"}], stock_status:"instock", stock_quantity:3, short_description:"Chevrolet Aveo / Optra", icon:"💿"},
 {id:3, name:"Filtro de aceite", sku:"FL-2001", price:"6.50", categories:[{name:"Filtros"}], stock_status:"instock", stock_quantity:60, short_description:"Universal Toyota / Chevrolet", icon:"🛢️"},
 {id:4, name:"Filtro de aire", sku:"FL-2002", price:"9.00", categories:[{name:"Filtros"}], stock_status:"instock", stock_quantity:25, short_description:"Ford Fiesta / Ecosport", icon:"🌬️"},
 {id:5, name:"Bujías iridium (juego x4)", sku:"MO-3001", price:"32.00", categories:[{name:"Motor"}], stock_status:"instock", stock_quantity:9, short_description:"Motores 1.6L – 2.0L", icon:"⚡"},
 {id:6, name:"Kit correa de distribución", sku:"MO-3002", price:"48.00", categories:[{name:"Motor"}], stock_status:"instock", stock_quantity:5, short_description:"Chevrolet Spark / Aveo", icon:"⚙️"},
 {id:7, name:"Bomba de agua", sku:"MO-3003", price:"36.00", categories:[{name:"Motor"}], stock_status:"outofstock", stock_quantity:0, short_description:"Toyota Yaris / Corolla", icon:"💧"},
 {id:8, name:"Amortiguador delantero", sku:"SU-4001", price:"54.00", categories:[{name:"Suspensión"}], stock_status:"instock", stock_quantity:8, short_description:"Ford Fiesta 2008–2015", icon:"🔩"},
 {id:9, name:"Batería 12V 65Ah", sku:"EL-5001", price:"95.00", categories:[{name:"Eléctrico"}], stock_status:"instock", stock_quantity:2, short_description:"Libre mantenimiento", icon:"🔋"},
 {id:10, name:"Bombillo LED H4 (par)", sku:"EL-5002", price:"18.00", categories:[{name:"Eléctrico"}], stock_status:"instock", stock_quantity:30, short_description:"Universal 12V", icon:"💡"},
 {id:11, name:"Aceite 10W-40 · 4 L", sku:"LU-6001", price:"29.00", categories:[{name:"Lubricantes"}], stock_status:"instock", stock_quantity:40, short_description:"Semi-sintético", icon:"🧴"},
 {id:12, name:"Limpiaparabrisas (par)", sku:"AC-7001", price:"12.00", categories:[{name:"Accesorios"}], stock_status:"instock", stock_quantity:18, short_description:"Universal 20\" / 18\"", icon:"🌧️"},
];

async function loadProducts(){
  if(!CONFIG.wcSite) return DEMO;
  /* WooCommerce real: usa claves de solo lectura o un endpoint público (Store API):
     const r = await fetch(CONFIG.wcSite + "/wp-json/wc/store/v1/products?per_page=50");
     const d = await r.json();  // Store API devuelve prices.price en centavos
     return d.map(p => ({id:p.id, name:p.name, sku:p.sku, price:(p.prices.price/100).toFixed(2),
       categories:p.categories, stock_status:p.is_in_stock?"instock":"outofstock",
       stock_quantity:p.low_stock_remaining ?? 99, short_description:p.short_description, icon:"🔧"}));
  */
  return DEMO;
}

/* ============ ESTADO ============ */
let products = [], cat = "Todos", term = "", cart = {};
try{ cart = JSON.parse(localStorage.getItem("ap_cart")||"{}"); }catch(e){ cart = {}; }
const $ = s => document.querySelector(s);
const money = n => CONFIG.currency + Number(n).toFixed(2);
const save = () => { try{ localStorage.setItem("ap_cart", JSON.stringify(cart)); }catch(e){} };
const strip = h => (h||"").replace(/<[^>]*>/g,"");

/* ============ CATÁLOGO ============ */
function renderChips(){
  const cats = ["Todos", ...new Set(products.map(p=>p.categories[0].name))];
  $("#chips").innerHTML = cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
}
function renderGrid(){
  const t = term.toLowerCase();
  const list = products.filter(p =>
    (cat==="Todos" || p.categories[0].name===cat) &&
    (p.name+p.sku+strip(p.short_description)).toLowerCase().includes(t));
  $("#grid").innerHTML = list.length ? list.map(p=>{
    const out = p.stock_status!=="instock";
    const st = out ? `<span class="stock out">Agotado</span>` :
      p.stock_quantity<=5 ? `<span class="stock low">Quedan ${p.stock_quantity}</span>` : `<span class="stock in">Disponible</span>`;
    return `<article class="card">
      <div class="thumb">${p.icon||"🔧"}</div>
      <div class="cat">${p.categories[0].name}</div>
      <h3>${p.name}</h3>
      <div class="fit">${strip(p.short_description)}</div>
      <div class="sku">SKU ${p.sku}</div>${st}
      <div class="row"><span class="price">${money(p.price)}</span>
      <button class="add" data-id="${p.id}" ${out?"disabled":""}>Agregar</button></div>
    </article>`;}).join("") : `<div class="empty">No encontramos repuestos con esa búsqueda.</div>`;
}

/* ============ CARRITO ============ */
const find = id => products.find(p=>p.id==id);
function add(id,d=1){
  const p = find(id); if(!p) return;
  const n = Math.max(0,(cart[id]||0)+d);
  if(n>p.stock_quantity) return;
  n ? cart[id]=n : delete cart[id];
  save(); renderCart();
}
function renderCart(){
  const ids = Object.keys(cart).filter(id=>find(id));
  let total = 0, count = 0;
  $("#items").innerHTML = ids.length ? ids.map(id=>{
    const p = find(id), q = cart[id], sub = p.price*q; total+=sub; count+=q;
    return `<div class="it"><div><strong>${p.name}</strong><br><small>${p.sku} · ${money(p.price)}</small>
      <div class="qty"><button data-d="-1" data-id="${id}">−</button>${q}<button data-d="1" data-id="${id}">+</button></div></div>
      <strong>${money(sub)}</strong></div>`;}).join("")
    : `<p class="empty" style="padding:30px 0">Tu carrito está vacío.</p>`;
  $("#count").textContent = count;
  $("#total").textContent = money(total);
  $("#send").disabled = !ids.length;
}
function sendWhatsApp(){
  const ids = Object.keys(cart).filter(id=>find(id));
  if(!ids.length) return;
  let total = 0;
  const lines = ids.map(id=>{ const p=find(id), q=cart[id]; total+=p.price*q;
    return `• ${q} x ${p.name} (${p.sku}) — ${money(p.price*q)}`; });
  const name = $("#cname").value.trim(), note = $("#cnote").value.trim();
  const msg = [`*Nuevo pedido · ${CONFIG.store}*`, name?`Cliente: ${name}`:"", "", ...lines, "",
    `*Total: ${money(total)}*`, note?`Vehículo/notas: ${note}`:""].filter((l,i,a)=>l!==""||a[i-1]!=="").join("\n");
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
}
const toggle = on => { $("#drawer").classList.toggle("on",on); $("#shade").classList.toggle("on",on); };

/* ============ EVENTOS ============ */
$("#chips").onclick = e => { const c=e.target.dataset.c; if(c){cat=c; renderChips(); renderGrid();} };
$("#q").oninput = e => { term=e.target.value; renderGrid(); };
$("#grid").onclick = e => { const id=e.target.dataset.id; if(id){ add(id); toggle(true); } };
$("#items").onclick = e => { const b=e.target; if(b.dataset.d) add(b.dataset.id, +b.dataset.d); };
$("#openCart").onclick = () => toggle(true);
$("#closeCart").onclick = $("#shade").onclick = () => toggle(false);
$("#send").onclick = sendWhatsApp;

loadProducts().then(p=>{ products=p; renderChips(); renderGrid(); renderCart(); });
</script>
</body>
</html>
